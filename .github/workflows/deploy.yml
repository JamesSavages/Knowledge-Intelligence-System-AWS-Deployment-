name: Deploy to EC2

on:
  push:
    branches:
      - main # Change this to master if that is your primary branch name

jobs:
  deploy:
    runs-on: self-hosted # This tells GitHub to use the runner in your screenshot!

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull and Run Docker container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }} 
          IMAGE_TAG: latest
        run: |
          # Stop and remove the old container if it exists
          sudo docker stop knowledge-bot || true
          sudo docker rm knowledge-bot || true

          # Pull the latest image from AWS ECR
          sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          # Run the new container, injecting your secrets
          sudo docker run -d \
            --name knowledge-bot \
            -p 8080:8080 \
            -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            -e AWS_BUCKET_NAME="${{ secrets.AWS_BUCKET_NAME }}" \
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG